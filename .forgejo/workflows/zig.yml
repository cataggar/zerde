name: Zig

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: zig-ci

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      # ghr's install composite uses GitHub's $/ self-reference, which is not
      # supported by Forgejo Runner, so bootstrap the pinned CLI explicitly.
      - name: Install Zig via ghr
        run: .forgejo/scripts/install-zig-with-ghr.sh

      - name: Show Zig version
        run: |
          expected="$(sed -nE 's/^[[:space:]]*\.minimum_zig_version = "([^"]+)".*/\1/p' build.zig.zon)"
          actual="$(zig version)"
          echo "$actual"
          test "$actual" = "$expected"

      - name: Build and test
        run: zig build test
